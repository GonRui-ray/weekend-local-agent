name: Check and package Agent
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: space/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r space/requirements.txt
      - name: Verify domain, adapters, sessions and HTTP
        run: python -m unittest discover -s tests -v
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Build ModelScope upload folder
        run: python scripts/build_space.py
      - uses: actions/upload-artifact@v4
        with:
          name: weekend-agent-modelscope
          path: build/modelscope/
          if-no-files-found: error
