name: Publish product showcase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Build GitHub Pages
        working-directory: frontend
        env:
          # This is a public HTTPS endpoint, never an API key.
          VITE_AGENT_API_URL: ${{ vars.AGENT_API_URL }}
          VITE_STATIC_PREVIEW: "true"
        run: |
          npm ci
          VITE_PUBLIC_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
          cp ../example-response.json dist/sample-response.json
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
